{{- if .Values.policy.useRego }}
apiVersion: config.ratify.deislabs.io/v1beta1
kind: Policy
metadata:
  name: "ratify-policy"
spec:
  type: "rego-policy"
  parameters:
    passthroughEnabled: false
    policy: |
      package ratify.policy

      default valid := false

      # all artifacts MUST be valid
      valid {
        not failed_verify(input)
      }

      # all reports MUST pass the verification
      failed_verify(reports) {
        [path, value] := walk(reports)
        value == false
        path[count(path) - 1] == "isSuccess"
      }

      # each artifact MUST have at least one report
      failed_verify(reports) {
        [path, value] := walk(reports)
        path[count(path) - 1] == "verifierReports"
        count(value) == 0
      }
{{- else }}
apiVersion: config.ratify.deislabs.io/v1beta1
kind: Policy
metadata:
  name: "ratify-policy"
spec:
  type: "config-policy"
  parameters:
    artifactVerificationPolicies:
      default: "all"
      # cosign v3 stores each Sigstore bundle as a separate referrer, so one valid bundle is sufficient (matches cosign verify)
      application/vnd.dev.sigstore.bundle.v0.3+json: "any"
{{- end }}