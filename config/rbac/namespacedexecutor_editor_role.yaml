# This rule is not used by the project crd itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the config.ratify.sh.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.
#
# SECURITY: A NamespacedExecutor overrides the cluster-scoped Executor for its
# namespace and can therefore weaken image verification there. Grant this role
# only to trusted namespace admins.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: crd
    app.kubernetes.io/managed-by: kustomize
  name: namespacedexecutor-editor-role
rules:
- apiGroups:
  - config.ratify.sh
  resources:
  - namespacedexecutors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - config.ratify.sh
  resources:
  - namespacedexecutors/status
  verbs:
  - get
