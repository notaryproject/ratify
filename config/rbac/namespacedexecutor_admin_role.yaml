# This rule is not used by the project crd itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over config.ratify.sh.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.
#
# SECURITY: A NamespacedExecutor overrides the cluster-scoped Executor for its
# namespace and can therefore weaken image verification there. Write access to
# namespacedexecutors must be tightly restricted to trusted namespace admins.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: crd
    app.kubernetes.io/managed-by: kustomize
  name: namespacedexecutor-admin-role
rules:
- apiGroups:
  - config.ratify.sh
  resources:
  - namespacedexecutors
  verbs:
  - '*'
- apiGroups:
  - config.ratify.sh
  resources:
  - namespacedexecutors/status
  verbs:
  - get
