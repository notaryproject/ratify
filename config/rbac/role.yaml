---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - config.ratify.sh
  resources:
  - executors
  - namespacedexecutors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - config.ratify.sh
  resources:
  - executors/finalizers
  - namespacedexecutors/finalizers
  verbs:
  - update
- apiGroups:
  - config.ratify.sh
  resources:
  - executors/status
  - namespacedexecutors/status
  verbs:
  - get
  - patch
  - update
