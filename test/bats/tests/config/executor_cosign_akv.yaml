apiVersion: config.ratify.sh/v2beta1
kind: Executor
metadata:
  name: ratify-gatekeeper-provider-executor-1
spec:
  scopes:
    - "__TEST_REGISTRY__/cosign"
  stores:
    - type: registry-store
      parameters:
        # cosign signatures are pushed as a `sha256-<digest>.sig` tag
        allowCosignTag: true
        credential:
          # the provider pulls from ACR with its workload identity, matching the
          # store credential the helm chart deploys for the AKS e2e
          provider: "azure"
  verifiers:
    - name: cosign-1
      type: cosign
      parameters:
        trustPolicies:
          - scopes:
              - "__TEST_REGISTRY__/cosign"
            # the test images are signed offline
            # (`cosign sign --tlog-upload=false`), so there is no transparency
            # log entry and no observer timestamp to check
            ignoreTLog: true
            ignoreObserverTimestamps: true
            keys:
              azurekeyvault:
                vaultURL: "__VAULT_URI__"
                clientID: "__CLIENT_ID__"
                tenantID: "__TENANT_ID__"
                keys:
                  - name: "__COSIGN_KEY_NAME__"
  policyEnforcer:
    type: "threshold-policy"
    parameters:
      policy:
        threshold: 1
        rules:
          - verifierName: "cosign-1"
