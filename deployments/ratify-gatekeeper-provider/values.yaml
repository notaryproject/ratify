image:
  repository: "ghcr.io/notaryproject/ratify-gatekeeper-provider"
  pullPolicy: IfNotPresent
  tag: "v2.0.0-beta.2"

replicaCount: 1

logger:
  level: info

# resources sets the container resource requests and limits. Requests are
# required for CPU-based autoscaling (HPA). Defaults match the v1 chart.
resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 600m
    memory: 512Mi

metrics:
  enabled: true
  port: 8888

executor:
  scopes: []
  concurrency: 3
notation:
  scopes: []
  trustedIdentities: []
  certs:
  # - provider: "inline"
  #   cert: "" # PEM encoded certificate, e.g. "-----BEGIN CERTIFICATE-----\n...\n-----END CERTIFICATE-----"
  # - provider: "azurekeyvault" # use "azurekeyvault" to use Azure Key Vault
  #   vaultURL: "" # e.g. "https://my-key-vault.vault.azure.net/"
  #   clientID: "" # optional
  #   tenantID: "" # optional
  #   certificates:
  #     - name: "" # name of the certificate in Azure Key Vault
  #       version: "" # optional, if not provided, the latest version will be used
cosign:
  scopes: []
  certificateIdentity: ""
  certificateIdentityRegex: ""
  certificateOIDCIssuer: ""
  certificateOIDCIssuerRegex: ""
  ignoreTLog: false
  ignoreCTLog: false
  ignoreObserverTimestamps: false
  keys:
    # provider: "inline"
    # key: "" # PEM encoded public key  e.g. "-----BEGIN PUBLIC KEY-----\n...\n-----END PUBLIC KEY-----"
    # or
    # provider: "azurekeyvault" # use "azurekeyvault" to use Azure Key Vault
    # vaultURL: "" # e.g. "https://my-key-vault.vault.azure.net/"
    # clientID: "" # optional
    # tenantID: "" # optional
    # keys:
    #   - name: "" # name of the key in Azure Key Vault
    #     version: "" # optional, if not provided, the latest version will be used

stores:
  - scopes: []
    plainHttp: false # set to true for registries that do not use TLS (e.g. local development)
    caBase64: "" # base64 encoded CA certificate, used for TLS verification, e.g. "LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCg=="
    caPem: "" # PEM encoded CA certificate, used for TLS verification, e.g. "-----BEGIN CERTIFICATE-----\n...\n-----END CERTIFICATE-----"
    # if both caBase64 and caPem are provided, caPem will be used
    credential:
      provider: "static"
      username: ""
      password: ""
    # provider: "azure" # use "azure" to use Azure Workload Identity
    # clientID: "" # optional
    # tenantID: "" # optional
    # identityBinding: # optional, use AKS identity binding instead of workload identity federation
    #   enabled: true # annotates the pod with azure.workload.identity/use-identity-binding
    #                 # so the AKS webhook injects the identity binding token endpoint config
    # provider: "aws" # use "aws" to pull from Amazon ECR with IAM Roles for Service Accounts (IRSA),
    #                 # add eks.amazonaws.com/role-arn to serviceAccount.annotations
    # region: "" # optional, derived from the ECR registry host if not provided
    # provider: "alibabacloud" # use "alibabacloud" to pull from Alibaba Cloud ACR with RAM Roles for Service Accounts (RRSA),
    #                          # add pod-identity.alibabacloud.com/role-name to serviceAccount.annotations
    #                          # and label the release namespace with pod-identity.alibabacloud.com/injection=on
    # defaultInstanceId: "" # ACR Enterprise Edition instance ID, used for registries not listed in acrInstancesConfig
    # acrInstancesConfig: # ACR Enterprise Edition instances, either this or defaultInstanceId is required
    #   - instanceName: "" # e.g. "myinstance" for myinstance-registry.cn-hangzhou.cr.aliyuncs.com
    #     instanceId: "" # e.g. "cri-xxxxxxxxxxxxxxxx"
provider:
  tls:
    crt: "" # crt used by ratify (httpserver), please provide your own crt
    key: "" # key used by ratify (httpserver), please provide your own key
    caCert: "" # CA crt used by ratify (httpserver), please provide your own CA crt
    disableCertRotation: false
  disableMutation: false
  disableCRDManager: false
  mutationExcludedNamespaces: []
  timeout:
    # timeout values must match gatekeeper webhook timeouts
    validationTimeoutSeconds: 5
    mutationTimeoutSeconds: 2

gatekeeper:
  namespace: "gatekeeper-system"

serviceAccount:
  create: true
  name: ratify-gatekeeper-provider-admin
  # annotations to add to the service account
  annotations: {}
    # add azure.workload.identity/client-id if using Azure Workload Identity
    # add eks.amazonaws.com/role-arn if using the aws store credential provider
    # add pod-identity.alibabacloud.com/role-name if using the alibabacloud store credential provider
