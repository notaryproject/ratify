apiVersion: config.ratify.sh/v2beta1
kind: Executor
metadata:
  name: {{ include "ratify.fullname" . }}-executor-1
  labels:
    {{- include "ratify.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "5"
spec:
  scopes:
    {{- if .Values.executor.scopes }}
    {{- toYaml .Values.executor.scopes | nindent 4 }}
    {{- else }}
    {{- fail "executor.scopes must not be empty" }}
    {{- end }}
  concurrency: {{ .Values.executor.concurrency | default 3 }}
  stores:
    {{- $root := . -}}
    {{- range .Values.stores }}
    - type: registry-store
      {{- if .scopes }}
      scopes:
        {{- toYaml .scopes | nindent 10 }}
      {{- end }}
      parameters:
        credential:
          provider: "{{ .credential.provider }}"
          {{- if eq .credential.provider "static" }}
          username: "{{ .credential.username }}"
          password: "{{ .credential.password }}"
          {{- end }}
          {{- if eq .credential.provider "azure" }}
          {{- if .credential.clientID }}
          clientID: "{{ .credential.clientID }}"
          {{- end }}
          {{- if .credential.tenantID }}
          tenantID: "{{ .credential.tenantID }}"
          {{- end }}
          {{- if and .credential.identityBinding .credential.identityBinding.enabled }}
          identityBinding:
            enabled: true
          {{- end }}
          {{- end }}
        {{- if .plainHttp }}
        {{- if or .caBase64 .caPem }}
        {{- fail (printf "store with scopes %v: plainHttp cannot be combined with caBase64/caPem (no TLS over plain HTTP)" .scopes) }}
        {{- end }}
        plainHttp: true
        {{- else }}
        {{- if .caPem }}
        caPem: {{ .caPem | quote }}
        {{- end }}
        {{- if .caBase64 }}
        caBase64: {{ .caBase64 | quote }}
        {{- end }}
        {{- end }}
        {{- if eq (include "ratify.cosignConfigured" $root) "true" }}
        allowCosignTag: true
        {{- end }}
    {{- end }}
  verifiers:
    {{- if eq (include "ratify.cosignConfigured" .) "true" }}
    - name: cosign-1
      type: cosign
      parameters:
        trustPolicies:
          - {{- if .Values.cosign.scopes }}
            scopes:
              {{- toYaml .Values.cosign.scopes | nindent 14 }}
            {{- end }}
            certificateIdentity: "{{ .Values.cosign.certificateIdentity }}"
            certificateIdentityRegex: "{{ .Values.cosign.certificateIdentityRegex }}"
            certificateOIDCIssuer: "{{ .Values.cosign.certificateOIDCIssuer }}"
            certificateOIDCIssuerRegex: "{{ .Values.cosign.certificateOIDCIssuerRegex }}"
            ignoreTLog: {{ .Values.cosign.ignoreTLog }}
            {{- if not .Values.cosign.keys }}
            ignoreCTLog: {{ .Values.cosign.ignoreCTLog }}
            {{- end }}
            ignoreObserverTimestamps: {{ .Values.cosign.ignoreObserverTimestamps }}
            {{- if .Values.cosign.keys }}
            {{- if eq .Values.cosign.keys.provider "inline" }}
            {{- if .Values.cosign.keys.key }}
            keys:
              inline:
                keys: {{ .Values.cosign.keys.key | quote }}
            {{- end }}
            {{- else if eq .Values.cosign.keys.provider "azurekeyvault" }}
            keys:
              azurekeyvault:
                vaultURL: "{{ .Values.cosign.keys.vaultURL }}"
                {{- if .Values.cosign.keys.clientID }}
                clientID: "{{ .Values.cosign.keys.clientID }}"
                {{- end }}
                {{- if .Values.cosign.keys.tenantID }}
                tenantID: "{{ .Values.cosign.keys.tenantID }}"
                {{- end }}
                keys:
                  {{- range .Values.cosign.keys.keys }}
                  - name: "{{ .name }}"
                    {{- if .version }}
                    version: "{{ .version }}"
                    {{- end }}
                  {{- end }}
            {{- end }}
            {{- end }}
    {{- end }}
    {{- if eq (include "ratify.notationConfigured" .) "true" }}
    - name: notation-1
      type: notation
      parameters:
        {{- if .Values.notation.scopes }}
        scopes:
          {{- toYaml .Values.notation.scopes | nindent 10 }}
        {{- end }}
        {{- if .Values.notation.trustedIdentities }}
        trustedIdentities:
          {{- toYaml .Values.notation.trustedIdentities | nindent 10 }}
        {{- end }}
        certificates:
          {{- range $index, $cert := .Values.notation.certs }}
          {{- if not $cert.provider }}
          {{- fail (printf "notation.certs[%d].provider must be set to inline, files or azurekeyvault" $index) }}
          {{- else if not (has $cert.provider (list "inline" "files" "azurekeyvault")) }}
          {{- fail (printf "Unsupported notation certificate provider: %s" $cert.provider) }}
          {{- end }}
          {{- end }}
          {{- range $certType := splitList " " (include "ratify.notationTrustStoreTypes" .) }}
          {{- $inlineCerts := list }}
          {{- $files := false }}
          {{- $akvCerts := list }}
          {{- range $.Values.notation.certs }}
          {{- if eq (include "ratify.notationCertType" .) $certType }}
          {{- if eq .provider "inline" }}
          {{- $inlineCerts = append $inlineCerts .cert }}
          {{- else if eq .provider "files" }}
          {{- $files = true }}
          {{- else if eq .provider "azurekeyvault" }}
          {{- $akvCerts = append $akvCerts . }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if gt (len $akvCerts) 1 }}
          {{- fail (printf "Only one azurekeyvault provider is supported for notation certificates of type %s" $certType) }}
          {{- end }}
          {{- if or $inlineCerts $files $akvCerts }}
          - type: {{ $certType | quote }}
            {{- if $inlineCerts }}
            inline:
              certs: {{ join "\n" $inlineCerts | quote }}
            {{- end }}
            {{- if $files }}
            files:
              - {{ include "ratify.notationCertsDir" $certType | quote }}
            {{- end }}
            {{- with first $akvCerts }}
            azurekeyvault:
              vaultURL: "{{ .vaultURL }}"
              clientID: "{{ .clientID }}"
              tenantID: "{{ .tenantID }}"
              certificates:
                {{- range $cert := .certificates }}
                - name: "{{ $cert.name }}"
                  version: "{{ $cert.version | default "" }}"
                {{- end }}
            {{- end }}
          {{- end }}
          {{- end }}
    {{- end }}
  policyEnforcer:
    type: "threshold-policy"
    parameters:
      policy:
        threshold: 1
        rules:
          {{- if eq (include "ratify.notationConfigured" .) "true" }}
          - verifierName: "notation-1"
          {{- end }}
          {{- if eq (include "ratify.cosignConfigured" .) "true" }}
          - verifierName: "cosign-1"
          {{- end }}
