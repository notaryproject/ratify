{{- if .Values.provider.disableCRDManager }}
{{- $executorSpec := include "ratify.executorSpec" . | fromYaml }}
{{- if hasKey $executorSpec "Error" }}
{{- fail (printf "failed to render the executor configuration: %s" $executorSpec.Error) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ratify.fullname" . }}-configmap
data:
  config.json: |
    {{- dict "executors" (list $executorSpec) | toPrettyJson | nindent 4 }}
{{- end }}
