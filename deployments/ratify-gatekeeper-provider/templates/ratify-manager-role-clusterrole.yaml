{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  creationTimestamp: null
  name: {{ include "ratify.fullname" . }}-manager-cluster-role
rules:
- apiGroups:
  - externaldata.gatekeeper.sh
  resources:
  - providers
  verbs:
  - get
  - list
  - patch
  - update
  - watch
# Secrets access is used for k8s auth provider to access secrets across namespaces.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
# Pods access is used to resolve the reporting pod for per-pod Executor status.
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - config.ratify.sh
  resources:
  - executorpodstatuses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - config.ratify.sh
  resources:
  - executorpodstatuses/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - config.ratify.sh
  resources:
  - executors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - config.ratify.sh
  resources:
  - executors/finalizers
  verbs:
  - update
- apiGroups:
  - config.ratify.sh
  resources:
  - executors/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - config.ratify.sh
  resources:
  - namespacedexecutors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - config.ratify.sh
  resources:
  - namespacedexecutors/finalizers
  verbs:
  - update
- apiGroups:
  - config.ratify.sh
  resources:
  - namespacedexecutors/status
  verbs:
  - get
  - patch
  - update
{{- end }}